# Code generation for the FDOS contract surface.
#
# The plugin is pinned to an exact version, for the same reason every GitHub
# Action is pinned to a commit SHA (ADR-0014): generated code is a build input,
# and an input that can change without a commit here makes the output
# irreproducible. `make proto-check` fails if this is ever loosened to a
# floating tag.
#
# Generated code is committed. It is a published contract that private
# repositories import (ADR-0004), so it must exist in the module the proxy
# serves — and committing it makes a drift check possible: `make proto-check`
# regenerates and fails on any diff.

version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/FabioCaffarello/fdos/libs/contracts/gen

plugins:
  # A LOCAL plugin, run through the project's own Go toolchain, not a remote
  # BSR plugin. The remote form made every `make verify` depend on an external,
  # rate-limited service — a build input that can fail for reasons unrelated to
  # the change, and an availability dependency ADR-0014 exists to prevent. It
  # was caught by a clean-clone run returning "resource_exhausted".
  #
  # `go run pkg@version` pins exactly and builds with the pinned toolchain, the
  # same reasoning as govulncheck in scripts/verify-vulns.sh. After the first
  # run it resolves from the module cache and needs no network.
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6"]
    out: libs/contracts/gen
    opt: paths=source_relative
