# Installs every tool `make verify` needs, at the versions pinned in mise.toml.
#
# This exists because the alternative failed silently for fourteen releases.
# `release.yml` carried a pruned copy of `verify.yml`'s setup — Go only — so
# `make verify` died at `toolchain-check` on every tag, and a tag push gates
# nothing, so nobody was told (docs/blocked.md — B-008).
#
# Copying the missing steps back would have restored the same trap for whoever
# adds the next tool. One definition, used by both workflows, cannot drift out
# of step with itself.
#
# Versions are never declared here. `scripts/tool-version.sh` reads mise.toml,
# so the pins developers use and the pins CI uses are the same pins (ADR-0014).

name: Set up the FDOS toolchain
description: Install Go, golangci-lint, gitleaks and buf at the versions pinned in mise.toml

outputs:
  go-version:
    description: The Go version resolved from mise.toml
    value: ${{ steps.pins.outputs.go }}
  # Whether `setup-go` restored the module and build caches.
  #
  # Exposed because the gate's duration is bimodal — 87s to 279s across twenty
  # runs, a 3.2x spread — and nothing recorded which mode a run was in. The
  # cache was the plausible explanation and stayed plausible for want of one
  # boolean (RFC-0018 Phase 0).
  cache-hit:
    description: Whether the Go module and build caches were restored
    value: ${{ steps.go.outputs.cache-hit }}
  # How much build cache actually arrived, measured after the restore.
  #
  # `cache-hit` turned out not to explain anything: runs reporting a hit were as
  # slow as runs reporting a miss, while every check that compiles Go was 6-14x
  # slower than on a tree whose dependencies had been stable (#139). A boolean
  # cannot distinguish "restored a cache" from "restored a cache useful for the
  # dependency set now being compiled". Kilobytes can.
  cache-bytes:
    description: Size of GOCACHE immediately after the restore, in kilobytes
    value: ${{ steps.cache-size.outputs.kilobytes }}

runs:
  using: composite

  steps:
    - name: Resolve pinned tool versions
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "go=$(scripts/tool-version.sh go)"
          echo "golangci-lint=$(scripts/tool-version.sh golangci-lint)"
          echo "gitleaks=$(scripts/tool-version.sh gitleaks)"
          echo "buf=$(scripts/tool-version.sh buf)"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.pins.outputs.go }}
        check-latest: false
        cache-dependency-path: "**/go.sum"

    # Immediately after the restore and before anything compiles, so this is
    # what the gate started with rather than what it ended with.
    - name: Measure the restored build cache
      id: cache-size
      shell: bash
      run: |
        set -euo pipefail
        dir="$(go env GOCACHE)"
        if [ -d "$dir" ]; then
          kb="$(du -sk "$dir" 2>/dev/null | awk '{print $1}')"
        else
          kb=0
        fi
        echo "kilobytes=${kb:-0}" >> "$GITHUB_OUTPUT"

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v${{ steps.pins.outputs.golangci-lint }}
        install-mode: binary
        # The Makefile runs it per module; this step only installs it.
        args: --help
        only-new-issues: false

    # The digest is resolved before the download and compared before anything is
    # extracted or made executable. Verifying afterwards would mean the artifact
    # had already been unpacked into a directory on PATH, which is most of what
    # an attacker needed.
    #
    # Expected digests come from tool-checksums.txt through one parser, exactly
    # as versions come from mise.toml through one parser. CI declares neither.
    - name: Install gitleaks
      shell: bash
      env:
        VERSION: ${{ steps.pins.outputs.gitleaks }}
      run: |
        set -euo pipefail
        expected="$(scripts/tool-checksum.sh gitleaks linux_x64)"
        curl -fsSL -o /tmp/gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        printf '%s  /tmp/gitleaks.tar.gz\n' "$expected" | sha256sum -c -
        tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
        gitleaks version

    - name: Install buf
      shell: bash
      env:
        VERSION: ${{ steps.pins.outputs.buf }}
      run: |
        set -euo pipefail
        expected="$(scripts/tool-checksum.sh buf Linux-x86_64)"
        curl -fsSL -o /tmp/buf "https://github.com/bufbuild/buf/releases/download/v${VERSION}/buf-Linux-x86_64"
        printf '%s  /tmp/buf\n' "$expected" | sha256sum -c -
        install -m 0755 /tmp/buf /usr/local/bin/buf
        buf --version
