# Supply chain checks that need GitHub context rather than a local toolchain.
#
# `make verify` already runs the secret and vulnerability scans per commit. What
# this adds is *time*: a vulnerability database changes without the repository
# changing, so a scan that only runs on push reports the state of the world on
# the day of the last commit.
#
# Schedule-only. It carried a `pull_request` trigger for a job that was disabled,
# which put a `skipped` check on every pull request (ADR-0048).
#
# Every action is pinned to a full commit SHA.

name: supply-chain

on:
  schedule:
    # Vulnerability databases change without the repository changing. A scan
    # that only runs on push reports the state of the world on the day of the
    # last commit, which for a stable module is arbitrarily long ago.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

# `dependency-review` used to live here, disabled with `if: false`, because the
# action needs GitHub's Dependency Graph and this repository does not have it —
# every run failed with "Dependency review is not supported on this repository".
#
# Disabling it at the *job* level left the workflow triggering on pull requests
# for a job that never ran, so every pull request grew a `supply-chain` check
# with conclusion `skipped`. The comment that disabled it made the argument
# against itself: "a permanently red check trains people to ignore CI, which
# costs more than the check was worth." A permanently skipped one is the quieter
# version of the same thing.
#
# So the trigger is gone and the job with it. To restore, once Dependency graph
# is enabled in repository settings (issue #55): add `pull_request:` back to
# `on:`, and a job using
# `actions/dependency-review-action` with `fail-on-severity: low` and
# `deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0` — the Apache-2.0 core
# (ADR-0002) means a copyleft dependency would make the licence claim in NOTICE
# false.
#
# `make vuln-check` (govulncheck, reachable vulnerabilities) runs in the gate
# regardless, so dependency scanning is not absent — only the PR-delta and
# licence view is.

jobs:
  vulnerabilities:
    # `make verify` already runs this per commit. What this adds is time:
    # vulnerability databases change without the repository changing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Go version
        id: pins
        run: echo "go=$(scripts/tool-version.sh go)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          check-latest: false

      - name: make vuln-check
        run: make vuln-check

  secrets:
    # The full-history scan, on the schedule as well as in `make verify`. A
    # secret committed and then removed is still leaked: the object stays
    # reachable and anyone who cloned before the removal already has it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
