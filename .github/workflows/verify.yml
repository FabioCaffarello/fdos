# The gate. Every pull request and every push to main runs this.
#
# It invokes `make verify` and nothing else (ADR-0014). A check that exists only
# in workflow YAML cannot be run locally, cannot be debugged without pushing,
# and drifts from what developers actually execute — producing the familiar
# failure where `make verify` passes and CI does not, and nobody can say why.
#
# Every action is pinned to a full commit SHA. A tag can be moved under the
# repository with no commit here, which is an unreviewed third party with write
# access to the build.

name: verify

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing in this workflow writes.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # The load-bearing half of ADR-0004. Without it, module resolution goes
  # through local workspace paths and the open-core boundary silently stops
  # being verified, with nothing to indicate that it has stopped.
  GOWORK: "off"

jobs:
  # Fast failure over the affected modules only, and **not a gate**.
  #
  # ADR-0014 rejected pruning `verify` by affectedness — under-reporting ships a
  # broken module and the failure is silent — and named where the speed belongs:
  # "Speed belongs in a separate job." This is that job (ADR-0045).
  #
  # It runs a strict subset of what `verify` runs, over a subset of the modules,
  # so it cannot go red while the gate is green. That is deliberate: a
  # non-required check that can fail on its own is one people learn to ignore,
  # and this repository has already disabled one for exactly that reason.
  #
  # `verify` does not depend on it. Making the gate wait on an advisory job
  # would make the advisory job a gate.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The affected set is a diff against the base, so the base has to be
          # in the clone.
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: make affected-preflight
        run: make affected-preflight BASE=origin/${{ github.base_ref || 'main' }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the ADR immutability check compares every decision
          # against the commit that introduced it, and the secret scan reads
          # every commit rather than the working tree.
          fetch-depth: 0

      # mise.toml is the single source of truth for every tool version. CI reads
      # the same pins developers do rather than declaring its own, so the two
      # cannot drift — and both workflows use one definition of "the toolchain",
      # so they cannot drift from each other either (B-008).
      - name: Set up the toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain

      - name: make verify
        run: make verify

      # Records what this run ran on. The gate's duration is bimodal — 87s to
      # 279s across twenty runs — and the cache was the plausible cause with
      # nothing recording it, so the explanation could never be confirmed or
      # killed. `if: always()` because a failed run's environment is the one
      # most worth having (RFC-0018 Phase 0).
      - name: make ci-summary
        if: always()
        env:
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain.outputs.cache-hit }}
        run: make ci-summary
