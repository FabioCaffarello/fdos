# Release: signed artifacts with an SBOM and verifiable build provenance.
#
# Triggered by a tag, which `release-tag.yml` is the only thing allowed to push
# (ADR-0046). Tags are `libs/<name>/vX.Y.Z` and `apps/<name>/vX.Y.Z`, following
# Go's subdirectory-prefixed convention (ADR-0004).
#
# # What a release carries is decided by the module, not by the tag shape
#
# This workflow used to hardcode `libs/analysis` and `fdoslint` while triggering
# on `libs/*/v*`, so **every library tag published a linter**. The release for
# `libs/kernel/v0.9.0` carries `fdoslint_linux_amd64`, an SBOM called
# `fdoslint.spdx.json`, and a signed `SHA256SUMS` describing none of the kernel.
# An adopter verifying that signature is verifying a linter, and the signature is
# real — which makes it worse than no signature, because it looks like evidence
# (ADR-0047).
#
# `make release-artifacts` now assembles what the *module* publishes: its
# binaries if it has any, and for a `libs/*` module the zip the proxy serves,
# which is the artifact an external build actually consumes.
#
# The workflow invokes `make` and a shared composite action, and holds no logic
# of its own (ADR-0014). Every action is pinned to a full commit SHA.

name: release

on:
  push:
    tags:
      - "libs/*/v*"
      - "apps/*/v*"

  # A tag pushed by `release-tag.yml` does **not** trigger the push event above.
  # GitHub suppresses workflow runs for events created with `GITHUB_TOKEN`, to
  # stop workflows triggering themselves — so the dispatched publication path
  # ADR-0046 built could create a tag and nothing would build it. Measured:
  # `libs/kernel-wire/v0.3.0`, pushed from a maintainer's own credentials,
  # triggered this workflow; `libs/ledger-wire/v0.5.0`, pushed by the workflow,
  # triggered nothing at all (ADR-0051).
  #
  # So the release is dispatchable against an existing tag. It is the same job
  # either way — one entry point, two ways in.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to build, e.g. libs/ledger-wire/v0.5.0"
        required: true
        type: string

  # Called by `release-tag.yml` immediately after it pushes the tag, so
  # publication is one dispatch again (ADR-0052). A call is not an event, so the
  # GITHUB_TOKEN guard that suppressed the push trigger does not apply to it.
  workflow_call:
    inputs:
      tag:
        description: "The tag just created, e.g. libs/ledger-wire/v0.5.0"
        required: true
        type: string

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # create the release
      id-token: write # keyless signing and provenance
      attestations: write # attach the provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.ref_name` is the tag on a push and the branch on a dispatch,
          # so the tag is named explicitly rather than inferred.
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      # The same toolchain the gate uses. This step once installed Go alone,
      # which is why `make verify` below failed on all fourteen tags and no
      # release was ever published (B-008).
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      # The gate runs again on the exact tagged commit. A release built from
      # source that has not passed verification is a release of unknown code.
      - name: make verify
        run: make verify

      - name: make release-artifacts
        id: artifacts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: make release-artifacts

      - name: Sign and attest
        uses: ./.github/actions/release-evidence
        with:
          module: ${{ steps.artifacts.outputs.module }}

      # Proving a published *module* is importable is a statement about a
      # library (ADR-0020). Applications are not imported, so this stays on the
      # library path rather than being generalised or skipped conditionally
      # inside the shared action (ADR-0039 §3).
      #
      # Not in `make verify`: it depends on proxy propagation, which the
      # per-commit gate must not inherit.
      - name: Prove the published module is consumable
        if: startsWith(inputs.tag || github.ref_name, 'libs/')
        run: make consumer-check

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --generate-notes dist/*
